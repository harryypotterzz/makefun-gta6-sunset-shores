<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Shores — Open World Crime in Palm Bay</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0f16;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* 16:9 canvas that always fits the window, letterboxed. */
  #game {
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    display: block;
    touch-action: none;
    background: #7fae62;
  }
  /* Visually hidden live region for screen readers. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"
    aria-label="Sunset Shores: explore Palm Bay on foot or by car, outrun the police, and run jobs for Mara"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { boot } from './src/main.js';
  boot(document.getElementById('game'));
</script>
</body>
</html>
